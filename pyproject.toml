[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-owner-classifier"
version = "1.1.2"
description = "Windows desktop tool for classifying construction photos by responsible person"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<6",
  "rapidfuzz>=3.10,<4",
  "rapidocr==3.9.2",
  "zai-sdk==0.2.3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
paddle = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
dev = ["pytest>=8,<9", "pyinstaller>=6.10,<7"]

[project.scripts]
construction-owner-classifier = "owner_classifier.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: runs OCR against the supplied image samples"]
